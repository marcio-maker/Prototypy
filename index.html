<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F4EFE8" />
<title>HairOS — Inspiração • Visagismo • Você</title>
<meta name="description" content="HairOS — plataforma de inspiração capilar, visagismo, cortes, coloração, penteados e recomendações de produtos profissionais." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ========== DESIGN TOKENS ========== */
  :root{
    --bg-light:#F4EFE8;
    --bg-dark:#111114;
    --brown:#33251E;
    --gold:#B8956A;
    --beige:#E7D8C5;
    --text:#25211D;
    --text-muted:#77716B;
    --white:#FFFFFF;
    --line:#E2D8CA;
    --shadow-sm:0 2px 8px rgba(51,37,30,.06);
    --shadow-md:0 6px 24px rgba(51,37,30,.10);
    --shadow-lg:0 12px 40px rgba(51,37,30,.14);
    --radius:14px;
    --radius-sm:10px;
    --radius-lg:22px;
    --font-serif:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-sans:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --maxw:1200px;
    --nav-h:64px;
    --pad-x:20px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font-sans);
    background:var(--bg-light);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,h4{font-family:var(--font-serif);font-weight:500;line-height:1.15;margin:0;color:var(--text);}
  p{margin:0;}
  ul{margin:0;padding:0;list-style:none;}

  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px;}

  .container{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad-x);padding-right:var(--pad-x);}

  .eyebrow{
    font-family:var(--font-sans);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .muted{color:var(--text-muted);}

  /* ========== TOPBAR ========== */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(244,239,232,.92);
    backdrop-filter:saturate(1.2) blur(10px);
    -webkit-backdrop-filter:saturate(1.2) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex;align-items:center;gap:12px;
    height:var(--nav-h);
    max-width:var(--maxw);margin:0 auto;
    padding:0 var(--pad-x);
  }
  .brand{display:flex;flex-direction:column;line-height:1;flex-shrink:0;}
  .brand-name{font-family:var(--font-serif);font-size:26px;font-weight:600;letter-spacing:.02em;color:var(--brown);}
  .brand-name .dot{color:var(--gold);}
  .brand-sub{font-size:8.5px;letter-spacing:.26em;color:var(--text-muted);margin-top:3px;font-weight:600;}
  .top-nav{display:none;gap:26px;margin-left:32px;}
  .top-nav a{
    font-size:13.5px;color:var(--text);font-weight:500;
    padding:6px 0;position:relative;transition:color .18s;
  }
  .top-nav a:hover,.top-nav a.active{color:var(--gold);}
  .top-nav a.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--gold);
  }
  .topbar-actions{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .icon-btn{
    width:40px;height:40px;display:grid;place-items:center;
    border-radius:50%;color:var(--brown);transition:background .18s;
  }
  .icon-btn:hover{background:rgba(184,149,106,.14);}
  .icon-btn .badge{
    position:absolute;transform:translate(12px,-12px);
    background:var(--gold);color:var(--white);
    font-size:9.5px;font-weight:700;
    min-width:16px;height:16px;padding:0 4px;
    border-radius:10px;display:none;place-items:center;
  }
  .icon-btn.has-fav .badge{display:grid;}

  /* Search bar (desktop) */
  .search-wrap{
    display:none;position:relative;flex:1;max-width:360px;margin-left:24px;
  }
  .search-wrap input{
    width:100%;height:38px;padding:0 38px 0 38px;
    border-radius:19px;border:1px solid var(--line);
    background:var(--white);font-family:inherit;font-size:13.5px;color:var(--text);
    transition:border-color .18s, box-shadow .18s;
  }
  .search-wrap input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,106,.15);}
  .search-wrap .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
  .search-wrap .s-clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:var(--text-muted);
  }
  .search-wrap .s-clear.show{display:grid;}
  .search-wrap .s-clear:hover{background:var(--beige);color:var(--brown);}

  @media(min-width:900px){
    :root{--nav-h:74px;}
    .brand-name{font-size:30px;}
    .top-nav{display:flex;}
    .search-wrap{display:flex;}
    .mobile-only{display:none !important;}
  }

  /* ========== MOBILE BOTTOM NAV ========== */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:rgba(244,239,232,.96);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .bottom-nav button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:9px 2px 10px;min-height:56px;
    color:var(--text-muted);font-size:10.5px;font-weight:500;
    transition:color .18s;
    position:relative;
  }
  .bottom-nav button svg{width:22px;height:22px;}
  .bottom-nav button.active{color:var(--brown);}
  .bottom-nav button.active svg{color:var(--gold);}
  .bottom-nav button .badge{
    position:absolute;top:4px;right:calc(50% - 18px);
    background:var(--gold);color:var(--white);
    font-size:9px;font-weight:700;
    min-width:15px;height:15px;padding:0 4px;
    border-radius:8px;display:none;place-items:center;
  }
  .bottom-nav button.has-fav .badge{display:grid;}

  @media(min-width:900px){.bottom-nav{display:none;}}

  /* ========== MAIN ========== */
  main{
    min-height:calc(100vh - var(--nav-h));
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
  }
  @media(min-width:900px){main{padding-bottom:40px;}}

  .view{animation:fadeIn .32s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ========== HERO ========== */
  .hero{
    position:relative;background:var(--brown);
    color:var(--white);overflow:hidden;
    border-radius:0 0 var(--radius-lg) var(--radius-lg);
    margin-bottom:36px;
  }
  .hero-grid{display:grid;grid-template-columns:1fr;}
  .hero-media{position:relative;aspect-ratio:3/4;max-height:520px;overflow:hidden;}
  .hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 25%;}
  .hero-media::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(17,17,20,0) 30%,rgba(17,17,20,.85) 100%);
  }
  .hero-content{
    position:relative;padding:26px var(--pad-x) 34px;
    margin-top:-70px;z-index:2;
  }
  .hero h1{
    font-size:clamp(30px,7vw,46px);
    color:var(--white);line-height:1.08;margin-bottom:14px;
    letter-spacing:-.01em;
  }
  .hero h1 em{font-style:italic;color:var(--beige);}
  .hero p{
    color:rgba(255,255,255,.82);font-size:15px;max-width:460px;
    margin-bottom:24px;
  }
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:46px;padding:0 24px;border-radius:24px;
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.01em;
    transition:transform .15s, box-shadow .18s, background .18s, color .18s;
    min-width:44px;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--gold);color:var(--brown);}
  .btn-primary:hover{background:#c9a678;box-shadow:var(--shadow-md);}
  .btn-outline{background:transparent;color:var(--white);border:1.5px solid rgba(255,255,255,.4);}
  .btn-outline:hover{background:rgba(255,255,255,.1);border-color:var(--white);}
  .btn-dark{background:var(--brown);color:var(--white);}
  .btn-dark:hover{background:#231914;}
  .btn-ghost{background:var(--beige);color:var(--brown);}
  .btn-ghost:hover{background:#dcc9b0;}

  @media(min-width:900px){
    .hero{margin:24px auto 48px;max-width:var(--maxw);border-radius:var(--radius-lg);}
    .hero-grid{grid-template-columns:1.1fr 1fr;min-height:520px;}
    .hero-media{aspect-ratio:auto;max-height:none;height:100%;}
    .hero-media::after{background:linear-gradient(90deg,rgba(17,17,20,.7) 0%,rgba(17,17,20,0) 60%);}
    .hero-content{
      position:absolute;left:0;top:0;bottom:0;right:auto;
      display:flex;flex-direction:column;justify-content:center;
      max-width:560px;padding:60px 56px;margin:0;
      background:linear-gradient(90deg,rgba(17,17,20,.75),rgba(17,17,20,0));
      border-radius:var(--radius-lg);
    }
    .hero h1{font-size:clamp(40px,4.5vw,58px);}
    .hero p{font-size:16.5px;}
  }

  /* ========== SECTION HEADERS ========== */
  .section{padding:8px 0 44px;}
  .section-head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;margin-bottom:22px;flex-wrap:wrap;
  }
  .section-head h2{font-size:clamp(24px,4.6vw,34px);letter-spacing:-.01em;}
  .section-head .lead{color:var(--text-muted);font-size:14.5px;margin-top:6px;max-width:520px;}
  .link-more{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:600;color:var(--brown);
    padding:8px 0;transition:color .18s;
  }
  .link-more:hover{color:var(--gold);}
  .link-more svg{transition:transform .18s;}
  .link-more:hover svg{transform:translateX(3px);}

  /* ========== BENEFITS ========== */
  .benefits{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
    margin-bottom:44px;
  }
  .benefit{
    display:flex;align-items:flex-start;gap:10px;
    padding:14px 12px;border-radius:var(--radius-sm);
    background:var(--white);border:1px solid var(--line);
  }
  .benefit svg{color:var(--gold);flex-shrink:0;margin-top:2px;}
  .benefit b{display:block;font-size:12.5px;font-weight:600;color:var(--brown);line-height:1.25;}
  .benefit span{font-size:11.5px;color:var(--text-muted);line-height:1.35;display:block;margin-top:2px;}
  @media(min-width:768px){.benefits{grid-template-columns:repeat(4,1fr);}}

  /* ========== CATEGORY / CARD GRIDS ========== */
  .grid-cat{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  }
  @media(min-width:600px){.grid-cat{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid-cat{grid-template-columns:repeat(4,1fr);gap:18px;}}

  .cat-card{
    position:relative;display:block;overflow:hidden;
    border-radius:var(--radius);background:var(--brown);color:var(--white);
    aspect-ratio:3/4;
    transition:transform .22s, box-shadow .22s;
  }
  .cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s;}
  .cat-card:hover img{transform:scale(1.06);}
  .cat-card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(17,17,20,0) 40%,rgba(17,17,20,.88) 100%);
  }
  .cat-card-body{
    position:absolute;left:0;right:0;bottom:0;padding:14px;z-index:2;
  }
  .cat-card-body h3{font-size:17px;color:var(--white);line-height:1.15;margin-bottom:3px;}
  .cat-card-body p{font-size:11.5px;color:rgba(255,255,255,.75);line-height:1.35;}
  .cat-card-body .arrow{
    display:inline-flex;align-items:center;gap:5px;margin-top:8px;
    font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;
  }

  /* ========== BRAND CARDS ========== */
  .grid-brand{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  }
  @media(min-width:600px){.grid-brand{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid-brand{grid-template-columns:repeat(4,1fr);gap:14px;}}
  .brand-card{
    display:flex;align-items:center;justify-content:center;
    padding:24px 12px;border-radius:var(--radius-sm);
    background:var(--white);border:1px solid var(--line);
    font-family:var(--font-serif);font-size:19px;font-weight:600;
    color:var(--brown);letter-spacing:.02em;text-align:center;
    transition:border-color .18s, color .18s, transform .18s, background .18s;
    min-height:88px;
  }
  .brand-card:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px);}

  /* ========== RECOMMENDED COLLECTIONS ========== */
  .grid-rec{
    display:grid;grid-template-columns:1fr;gap:14px;
  }
  @media(min-width:600px){.grid-rec{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:900px){.grid-rec{grid-template-columns:repeat(3,1fr);gap:20px;}}
  .rec-card{
    display:grid;grid-template-columns:110px 1fr;gap:0;
    border-radius:var(--radius);overflow:hidden;
    background:var(--white);border:1px solid var(--line);
    transition:transform .2s, box-shadow .2s;
  }
  .rec-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .rec-card img{width:100%;height:100%;object-fit:cover;aspect-ratio:1;}
  .rec-card-body{padding:16px;}
  .rec-card-body .eyebrow{font-size:9.5px;margin-bottom:4px;}
  .rec-card-body h3{font-size:16px;line-height:1.2;margin-bottom:5px;}
  .rec-card-body p{font-size:12px;color:var(--text-muted);line-height:1.4;}

  /* ========== PAGE HEADER (categorias) ========== */
  .page-head{padding:28px 0 20px;}
  .breadcrumb{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    font-size:12px;color:var(--text-muted);margin-bottom:14px;
  }
  .breadcrumb a:hover{color:var(--gold);}
  .breadcrumb span{color:var(--brown);font-weight:500;}
  .page-head h1{font-size:clamp(28px,6vw,42px);line-height:1.08;margin-bottom:10px;}
  .page-head .intro{color:var(--text-muted);font-size:14.5px;max-width:640px;}

  /* ========== FILTER CHIPS ========== */
  .filters{
    display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
    height:34px;padding:0 16px;border-radius:18px;
    background:var(--white);border:1px solid var(--line);
    font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text);
    transition:all .18s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--gold);}
  .chip.active{background:var(--brown);color:var(--white);border-color:var(--brown);}

  /* ========== INSPIRATION GRID ========== */
  .grid-insp{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;
  }
  @media(min-width:600px){.grid-insp{grid-template-columns:repeat(3,1fr);gap:14px;}}
  @media(min-width:900px){.grid-insp{grid-template-columns:repeat(4,1fr);gap:18px;}}

  .insp-card{
    position:relative;display:block;overflow:hidden;
    border-radius:var(--radius);aspect-ratio:3/4;
    background:var(--beige);cursor:pointer;
    transition:transform .2s, box-shadow .2s;
  }
  .insp-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .insp-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
  .insp-card:hover img{transform:scale(1.05);}
  .insp-card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(17,17,20,0) 55%,rgba(17,17,20,.82) 100%);
    pointer-events:none;
  }
  .insp-info{
    position:absolute;left:0;right:0;bottom:0;padding:11px 12px;z-index:2;
    color:var(--white);pointer-events:none;
  }
  .insp-info h4{font-family:var(--font-serif);font-size:15px;color:var(--white);line-height:1.15;margin-bottom:2px;}
  .insp-info p{font-size:10.5px;color:rgba(255,255,255,.75);}
  .fav-btn{
    position:absolute;top:8px;right:8px;z-index:3;
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.9);color:var(--brown);
    display:grid;place-items:center;
    transition:background .18s, color .18s, transform .15s;
    backdrop-filter:blur(4px);
  }
  .fav-btn:hover{background:var(--white);}
  .fav-btn.active{color:#C94B4B;}
  .fav-btn:active{transform:scale(.9);}

  /* ========== MODAL ========== */
  .modal-backdrop{
    position:fixed;inset:0;z-index:100;
    background:rgba(17,17,20,.72);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;
    padding:0;
  }
  .modal-backdrop.open{display:flex;animation:fadeIn .2s ease;}
  .modal{
    background:var(--bg-light);width:100%;height:100%;
    max-height:100vh;overflow-y:auto;
    border-radius:0;position:relative;
    animation:slideUp .28s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:.5;}to{transform:none;opacity:1;}}
  @media(min-width:768px){
    .modal-backdrop{padding:32px;}
    .modal{max-width:820px;max-height:90vh;border-radius:var(--radius-lg);overflow-y:auto;}
  }
  .modal-close{
    position:sticky;top:12px;margin-left:auto;margin-right:12px;
    width:40px;height:40px;border-radius:50%;
    background:var(--white);color:var(--brown);
    display:grid;place-items:center;z-index:5;
    box-shadow:var(--shadow-sm);
  }
  .modal-close:hover{background:var(--beige);}
  .modal-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--beige);}
  @media(min-width:768px){.modal-img{aspect-ratio:16/10;max-height:420px;}}
  .modal-body{padding:20px var(--pad-x) 32px;}
  @media(min-width:768px){.modal-body{padding:26px 34px 36px;}}
  .modal-body h2{font-size:clamp(24px,4vw,32px);margin-bottom:6px;}
  .modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px;}
  .modal-tags span{
    font-size:11px;padding:5px 10px;border-radius:12px;
    background:var(--beige);color:var(--brown);font-weight:500;
  }
  .modal-body p{color:var(--text-muted);font-size:14.5px;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  /* ========== EMPTY STATE ========== */
  .empty{
    text-align:center;padding:60px 20px;
    color:var(--text-muted);
  }
  .empty svg{color:var(--beige);margin-bottom:14px;}
  .empty h3{font-size:22px;color:var(--brown);margin-bottom:8px;}
  .empty p{font-size:14px;max-width:360px;margin:0 auto 18px;}

  /* ========== MORE SHEET ========== */
  .sheet-backdrop{
    position:fixed;inset:0;z-index:110;
    background:rgba(17,17,20,.55);
    display:none;
  }
  .sheet-backdrop.open{display:block;animation:fadeIn .2s;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:120;
    background:var(--bg-light);
    border-radius:22px 22px 0 0;
    padding:10px 0 calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:80vh;overflow-y:auto;
  }
  .sheet.open{transform:none;}
  .sheet-handle{width:44px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px;}
  .sheet-list{padding:0 8px;}
  .sheet-list a,.sheet-list button{

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function normalize(str){
  return (str||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function favKey(id){ return "hairos_fav_" + id; }
function getFavs(){
  try{
    const raw = localStorage.getItem("hairos_favs");
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function setFavs(arr){
  try{ localStorage.setItem("hairos_favs", JSON.stringify(arr)); }catch(e){}
}
function isFav(id){ return getFavs().includes(id); }
function toggleFav(id){
  const arr = getFavs();
  const idx = arr.indexOf(id);
  if(idx >= 0) arr.splice(idx,1); else arr.push(id);
  setFavs(arr);
  updateFavBadge();
  return arr.includes(id);
}
function updateFavBadge(){
  const n = getFavs().length;
  const top = $("#favBadgeTop"); const bot = $("#favBadgeBottom");
  if(top){ top.textContent = n; top.closest(".icon-btn").classList.toggle("has-fav", n>0); }
  if(bot){ bot.textContent = n; bot.closest("button").classList.toggle("has-fav", n>0); }
}

function getCatById(id){ return categories.find(c => c.id === id); }
function getBrandById(id){ return brands.find(b => b.id === id); }
function getAffiliateById(id){ return affiliateLists.find(a => a.id === id); }

/* =========================================================
   ROUTER
   ========================================================= */
function parseHash(){
  const h = location.hash.replace(/^#/, "") || "/";
  return h;
}

function router(){
  const path = parseHash();
  currentRoute = path;
  activeFilter = "Todos";
  const app = $("#app");
  let html = "";

  if(path === "/" || path === "") html = renderHome();
  else if(path === "/categorias") html = renderCategorias();
  else if(path === "/cortes") html = renderCategoryPage("cortes");
  else if(path === "/coloracao") html = renderCategoryPage("coloracao");
  else if(path === "/penteados") html = renderCategoryPage("penteados");
  else if(path === "/noivas") html = renderCategoryPage("noivas");
  else if(path === "/produtos") html = renderCategoryPage("produtos");
  else if(path === "/ferramentas") html = renderCategoryPage("ferramentas");
  else if(path === "/marcas") html = renderMarcas();
  else if(path.startsWith("/marcas/")){
    const id = path.split("/")[2];
    html = renderMarca(id);
  }
  else if(path === "/recomendacoes") html = renderRecomendacoes();
  else if(path.startsWith("/lista/")){
    const id = path.split("/")[2];
    html = renderListaDetalhe(id);
  }
  else if(path === "/favoritos") html = renderFavoritos();
  else if(path === "/sobre" || path === "/contato" || path === "/privacidade" || path === "/termos"){
    html = renderInstitucional(path.slice(1));
  }
  else html = renderNotFound();

  // Append footer only on home & category & lists pages
  const showFooter = !["/favoritos"].includes(path);
  app.innerHTML = html + (showFooter ? renderFooter() : "");

  updateActiveNav();
  window.scrollTo({ top: 0, behavior: "instant" });
  bindEvents();
}

function updateActiveNav(){
  const path = currentRoute;
  let key = "";
  if(path === "/") key = "home";
  else if(path.startsWith("/categorias") || ["/cortes","/coloracao","/penteados","/noivas","/produtos","/ferramentas"].includes(path)) key = "categorias";
  else if(path.startsWith("/marcas")) key = "marcas";
  else if(path === "/favoritos") key = "favoritos";
  else if(path === "/recomendacoes") key = "recomendacoes";

  $$(".top-nav a").forEach(a => a.classList.toggle("active", a.dataset.nav === key));
  $$(".bottom-nav button").forEach(b => b.classList.toggle("active", b.dataset.nav === key));
}

/* =========================================================
   EVENTS
   ========================================================= */
function bindEvents(){
  // Category filter chips
  $$(".chip[data-filter]").forEach(chip => {
    chip.addEventListener("click", () => {
      activeFilter = chip.dataset.filter;
      router();
    });
  });

  // Inspiration card click -> modal
  $$(".insp-card").forEach(card => {
    card.addEventListener("click", (e) => {
      if(e.target.closest(".fav-btn")) return;
      openInspModal(card.dataset.insp);
    });
    card.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openInspModal(card.dataset.insp); }
    });
  });

  // Fav buttons
  $$(".fav-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.fav;
      const nowFav = toggleFav(id);
      btn.classList.toggle("active", nowFav);
      btn.querySelector("svg").setAttribute("fill", nowFav ? "currentColor" : "none");
      if(currentRoute === "/favoritos") router();
    });
  });
}

function openInspModal(id){
  const item = inspirations.find(i => i.id === id);
  if(!item) return;
  const fav = isFav(item.id);
  const cat = getCatById(item.cat);
  const modal = $("#modalContent");
  modal.innerHTML = `
    <button class="modal-close" id="modalClose" aria-label="Fechar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img class="modal-img" src="${item.img}" alt="${item.title}" />
    <div class="modal-body">
      <span class="eyebrow">${cat ? cat.name : item.cat}</span>
      <h2 class="mt-16">${item.title}</h2>
      <p>${item.desc}</p>
      <div class="modal-tags">
        ${item.tags.map(t => `<span>${t}</span>`).join("")}
      </div>
      <div class="modal-actions">
        <button class="btn ${fav?'btn-dark':'btn-primary'}" id="modalFav">
          ${fav ? 'Remover dos favoritos' : 'Salvar nos favoritos'}
        </button>
        <a class="btn btn-ghost" href="#/lista/${affiliateLists.find(a => a.category === item.cat)?.id || 'minhas-recomendacoes'}" id="modalCTA">
          Ver produtos relacionados
        </a>
      </div>
    </div>
  `;
  const backdrop = $("#modalBackdrop");
  backdrop.classList.add("open");
  document.body.style.overflow = "hidden";

  const close = () => {
    backdrop.classList.remove("open");
    document.body.style.overflow = "";
  };

  $("#modalClose").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if(e.target === backdrop) close(); });
  document.addEventListener("keydown", function esc(e){
    if(e.key === "Escape"){ close(); document.removeEventListener("keydown", esc); }
  });
  $("#modalFav").addEventListener("click", () => {
    const nowFav = toggleFav(item.id);
    $("#modalFav").textContent = nowFav ? "Remover dos favoritos" : "Salvar nos favoritos";
    $("#modalFav").className = "btn " + (nowFav ? "btn-dark" : "btn-primary");
    // rebind parent card state
    const cardBtn = document.querySelector(`.fav-btn[data-fav="${item.id}"]`);
    if(cardBtn){
      cardBtn.classList.toggle("active", nowFav);
      cardBtn.querySelector("svg").setAttribute("fill", nowFav ? "currentColor" : "none");
    }
  });
  $("#modalCTA").addEventListener("click", close);
}

/* =========================================================
   SEARCH
   ========================================================= */
function performSearch(term){
  const q = normalize(term.trim());
  if(!q) return { inspirations: [], brands: [], lists: [] };
  return {
    inspirations: inspirations.filter(i => normalize(i.title + " " + i.tags.join(" ") + " " + i.desc).includes(q)),
    brands: brands.filter(b => normalize(b.name).includes(q)),
    lists: affiliateLists.filter(l => normalize(l.title + " " + l.description).includes(q))
  };
}

function renderSearchResults(term){
  const box = $("#searchResults");
  const res = performSearch(term);
  const total = res.inspirations.length + res.brands.length + res.lists.length;

  if(!term.trim()){
    box.classList.remove("open");
    box.innerHTML = "";
    return;
  }

  let html = "";
  if(!total){
    html = `<div class="search-empty">Nenhum resultado para "<b>${term}</b>".</div>`;
  } else {
    if(res.inspirations.length){
      html += `<div class="search-group-title">Inspirações</div>`;
      html += res.inspirations.slice(0,6).map(i => `
        <button class="search-result" data-goto-insp="${i.id}">
          <img src="${i.img}" alt="" />
          <div><div class="sr-title">${i.title}</div><div class="sr-sub">${i.tags.slice(0,2).join(" · ")}</div></div>
        </button>
      `).join("");
    }
    if(res.brands.length){
      html += `<div class="search-group-title">Marcas</div>`;
      html += res.brands.slice(0,4).map(b => `
        <a class="search-result" href="${b.route}" data-search-link>
          <div style="width:38px;height:38px;border-radius:8px;background:var(--beige);display:grid;place-items:center;font-family:var(--font-serif);font-weight:600;color:var(--brown);flex-shrink:0;">${b.name[0]}</div>
          <div><div class="sr-title">${b.name}</div><div class="sr-sub">Marca</div></div>
        </a>
      `).join("");
    }
    if(res.lists.length){
      html += `<div class="search-group-title">Listas</div>`;
      html += res.lists.slice(0,4).map(l => `
        <a class="search-result" href="#/lista/${l.id}" data-search-link>
          <img src="${l.image}" alt="" />
          <div><div class="sr-title">${l.title}</div><div class="sr-sub">Lista de produtos</div></div>
        </a>
      `).join("");
    }
  }
  box.innerHTML = html;
  box.classList.add("open");

  box.querySelectorAll("[data-goto-insp]").forEach(b => {
    b.addEventListener("click", () => {
      openInspModal(b.dataset.gotoInsp);
      closeSearch();
    });
  });
  box.querySelectorAll("[data-search-link]").forEach(a => {
    a.addEventListener("click", () => closeSearch());
  });
}

function closeSearch(){
  $("#searchResults").classList.remove("open");
  const inp = $("#searchInput");
  if(inp) inp.value = "";
  $("#searchClear").classList.remove("show");
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  window.addEventListener("hashchange", router);
  if(!location.hash) location.hash = "#/";
  router();
  updateFavBadge();

  // Search
  const searchInput = $("#searchInput");
  const searchClear = $("#searchClear");
  searchInput.addEventListener("input", (e) => {
    const v = e.target.value;
    searchClear.classList.toggle("show", v.length > 0);
    renderSearchResults(v);
  });
  searchInput.addEventListener("keydown", (e) => {
    if(e.key === "Escape") closeSearch();
  });
  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchClear.classList.remove("show");
    closeSearch();
    searchInput.focus();
  });
  document.addEventListener("click", (e) => {
    if(!e.target.closest(".search-wrap") && !e.target.closest("#searchResults") && !e.target.closest("#mobileSearchBtn")){
      if($("#searchResults").classList.contains("open")) closeSearch();
    }
  });

  // Mobile search button
  const mobileSearchBtn = $("#mobileSearchBtn");
  if(mobileSearchBtn){
    mobileSearchBtn.addEventListener("click", () => {
      const inp = $("#searchInput");
      inp.focus();
      inp.scrollIntoView({behavior:"smooth", block:"center"});
    });
  }

  // More sheet
  const moreBtn = $("#moreBtn");
  const sheet = $("#moreSheet");
  const sheetBackdrop = $("#sheetBackdrop");
  const closeSheet = () => {
    sheet.classList.remove("open");
    sheetBackdrop.classList.remove("open");
    document.body.style.overflow = "";
  };
  moreBtn.addEventListener("click", () => {
    sheet.classList.add("open");
    sheetBackdrop.classList.add("open");
    document.body.style.overflow = "hidden";
  });
  sheetBackdrop.addEventListener("click", closeSheet);
  sheet.querySelectorAll("a").forEach(a => a.addEventListener("click", closeSheet));
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeSheet(); });

  // Bottom nav clicks (also triggers router via hash)
  $$(".bottom-nav button[data-route]").forEach(btn => {
    btn.addEventListener("click", () => {
      location.hash = btn.dataset.route;
    });
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
